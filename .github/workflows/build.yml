name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build with Java 21
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build mod
        run: gradle build --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: LovelyEasyPlace-${{ github.sha }}
          path: |
            build/libs/lovelyeasyplace-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name 'lovelyeasyplace-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$JAR_PATH"
          gh release create "$GITHUB_REF_NAME" "$JAR_PATH" --title "LovelyEasyPlace $GITHUB_REF_NAME" --generate-notes --verify-tag
